[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dsh-data-query-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/data_query"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
