      responses:
        '200': { description: Trigger/command endpoint (requires X-API-Key when authentication is enabled) }
        '401': { description: Missing or invalid API key when authentication is enabled }
  /api/v1/stock/regime-analysis:
    get:
      operationId: getStockRegimeAnalysis
      responses:
        '200': { description: Read-only endpoint }
  /api/v1/stock/sim/advance:
    post:
      operationId: postStockSimAdvance
      responses:
        '200': { description: Trigger/command endpoint (requires X-API-Key when authentication is enabled) }
        '401': { description: Missing or invalid API key when authentication is enabled }
  /api/v1/stock/sim/history:
    get:
      operationId: getStockSimHistory
      responses:
        '200': { description: Read-only endpoint }
  /api/v1/stock/sim/runs:
    get:
      operationId: getStockSimRuns
      responses:
        '200': { description: Read-only endpoint }
  /api/v1/stock/sim/start:
    post:
      operationId: postStockSimStart
      responses:
        '200': { description: Trigger/command endpoint (requires X-API-Key when authentication is enabled) }
        '401': { description: Missing or invalid API key when authentication is enabled }
  /api/v1/stock/sim/status:
    get:
      operationId: getStockSimStatus
      responses:
        '200': { description: Read-only endpoint }
  /api/v1/stock/technical-timing/backtest/latest:
    get:
      operationId: getStockTechnicalTimingBacktestLatest
      responses:
        '200': { description: Read-only endpoint }
